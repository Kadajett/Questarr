name: Slash Command Dispatch
on:
  issue_comment:
    types: [created]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/slash-command-dispatch@9bdcd7914ec1b75590b790b844aa3b8eee7c683a # v5
        with:
          token: ${{ secrets.PAT }}
          commands: deploy
          dispatch-type: workflow
          reaction: rocket
          permission: admin
